name: Linux runtime performance study
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  runtime-study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[research]'
      - run: ml-lab download
      - run: ml-lab train --epochs 10
      - run: python scripts/performance_study.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-runtime-study
          path: results/performance/
