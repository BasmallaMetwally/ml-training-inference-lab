name: Correctness and reproducibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --upgrade pip setuptools
      - if: runner.os == 'Linux'
        run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - if: runner.os == 'macOS'
        run: python -m pip install torch==2.15.0
      - run: python -m pip install -e '.[dev,quality]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python scripts/check_reproducibility.py --out results/reproducibility/runner.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: |
            test-results.xml
            results/reproducibility/runner.json

