name: Corrected Linux peak memory
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,research]'
      - run: python -m pytest -q tests/test_memory.py
      - run: ml-lab download
      - run: ml-lab train --epochs 10
      - run: python scripts/memory_study.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-linux-memory
          path: results/performance/memory-corrected.json
