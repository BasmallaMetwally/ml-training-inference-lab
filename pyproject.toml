[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-training-inference-lab"
version = "1.1.0"
description = "Reproducible PyTorch training, inference benchmarking and debugging tasks"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "scipy>=1.14"]
research = ["matplotlib>=3.9", "scipy>=1.14", "psutil>=6", "onnx>=1.17", "onnxscript>=0.2", "onnxruntime>=1.20"]
quality = ["ruff>=0.14"]

[project.scripts]
ml-lab = "ml_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["results", "runs", "data", "tasks/agent_suite/starter.py", "tasks/agent_v2", ".cache", ".mplconfig"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

